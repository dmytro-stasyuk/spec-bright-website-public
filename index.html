<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecBright</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #1a1a2e;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      line-height: 1;
    }
    h1 .bright { color: #d97706; }
    p {
      margin-top: 1rem;
      color: #555;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Spec<span class="bright">Bright</span></h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
